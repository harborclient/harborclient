name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: semver bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  package-releases:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORCHESTRATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Release packages
        run: |
          set -euo pipefail

          # Dispatches one package workflow with this parent run's correlation ID.
          dispatch_workflow() {
            local workflow="$1"

            echo "Dispatching ${workflow} with a ${{ inputs.release_type }} bump."
            gh workflow run "${workflow}" \
              --repo "${GITHUB_REPOSITORY}" \
              --ref main \
              -f branch=main \
              -f bump="${{ inputs.release_type }}" \
              -f orchestration_id="${ORCHESTRATION_ID}"
          }

          # Finds the correlated child run and waits for a successful conclusion.
          wait_for_workflow() {
            local workflow="$1"
            local run_id=''
            local run_url=''
            local run_data
            local match

            for attempt in $(seq 1 30); do
              run_data=$(
                gh run list \
                  --repo "${GITHUB_REPOSITORY}" \
                  --workflow "${workflow}" \
                  --event workflow_dispatch \
                  --limit 50 \
                  --json databaseId,displayTitle,url
              )
              match=$(
                jq -r \
                  --arg marker "[${ORCHESTRATION_ID}]" \
                  '[.[] | select(.displayTitle | contains($marker))][0] |
                    if . == null then empty else "\(.databaseId)\t\(.url)" end' \
                  <<< "${run_data}"
              )

              if [ -n "${match}" ]; then
                IFS=$'\t' read -r run_id run_url <<< "${match}"
                break
              fi

              echo "Waiting for ${workflow} to appear (${attempt}/30)..."
              sleep 2
            done

            if [ -z "${run_id}" ]; then
              echo "::error::Could not find the correlated ${workflow} run."
              return 1
            fi

            {
              echo "- [${workflow} run ${run_id}](${run_url})"
            } >> "$GITHUB_STEP_SUMMARY"

            if ! gh run watch "${run_id}" --repo "${GITHUB_REPOSITORY}" --exit-status; then
              echo "::error::${workflow} did not complete successfully."
              return 1
            fi
          }

          dispatch_workflow http-release.yml
          dispatch_workflow sdk-release.yml
          dispatch_workflow team-hub-api-release.yml
          dispatch_workflow team-hub-release.yml

          dependency_status=0
          wait_for_workflow http-release.yml || dependency_status=1
          wait_for_workflow sdk-release.yml || dependency_status=1
          wait_for_workflow team-hub-api-release.yml || dependency_status=1
          wait_for_workflow team-hub-release.yml || dependency_status=1
          if [ "${dependency_status}" -ne 0 ]; then
            echo "::error::Core release was not dispatched because a dependency package release failed."
            exit "${dependency_status}"
          fi

          # Core depends on HTTP, SDK, and team-hub-api, so publish it from their updated manifests.
          dispatch_workflow core-release.yml
          wait_for_workflow core-release.yml

          # Live-server depends on core and SDK, so publish it after core.
          dispatch_workflow live-server-release.yml
          wait_for_workflow live-server-release.yml

  ci:
    needs: package-releases
    uses: ./.github/workflows/ci.yml
    with:
      ref: main
    secrets: inherit

  release:
    needs: ci
    runs-on: ubuntu-latest
    env:
      VERSION: ''
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version
        id: bump
        working-directory: apps/harborclient
        run: |
          set -euo pipefail
          VERSION=$(pnpm version "${{ inputs.release_type }}" --no-git-tag-version | tail -n1 | sed 's/^v//')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $VERSION"

      - name: Update CHANGELOG.md for release
        if: env.VERSION != ''
        run: |
          set -euo pipefail

          python3 - "$VERSION" "$(date -u +%Y-%m-%d)" <<'PY'
          import re
          import sys
          import pathlib

          version, date_iso = sys.argv[1], sys.argv[2]
          path = pathlib.Path("CHANGELOG.md")
          if not path.exists():
              print("::warning::CHANGELOG.md not found; skipping changelog rename.")
              sys.exit(0)

          text = path.read_text()
          match = re.search(r"^## Unreleased\s*\n(.*?)(?=^## |\Z)", text, flags=re.S | re.M)
          if not match or not match.group(1).strip():
              print("::warning::No Unreleased content; skipping changelog rename.")
              sys.exit(0)

          body = match.group(1).strip("\n")
          replacement = f"## Unreleased\n\n## {version} - {date_iso}\n\n{body}\n"
          new_text = re.sub(
              r"^## Unreleased\s*\n.*?(?=^## |\Z)",
              replacement + "\n",
              text,
              count=1,
              flags=re.S | re.M,
          )
          path.write_text(new_text)
          PY

      - name: Commit, tag, and push
        if: env.VERSION != ''
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/harborclient/package.json CHANGELOG.md
          git commit -m "chore(changelog): release v${VERSION} [skip ci]"

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty after the release commit; cannot rebase. Commit or restore leftover files (often pnpm-lock.yaml)."
            git status --porcelain
            exit 1
          fi

          git fetch origin main
          max_attempts=5
          for attempt in $(seq 1 "${max_attempts}"); do
            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true
              echo "::error::Rebase onto origin/main failed."
              exit 1
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "::error::Failed to push release commit after ${max_attempts} attempts."
              exit 1
            fi
            echo "Push rejected (attempt ${attempt}/${max_attempts}); fetching and rebasing..."
            git fetch origin main
          done

          git tag -a "${TAG}" -m "Release v${VERSION}"
          git push origin "refs/tags/${TAG}"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage deb
          - os: macos-latest
            args: --mac
          # windows-latest ships VS 2026 (v18); pnpm's bundled node-gyp 11 cannot
          # detect it, so better-sqlite3 fails to compile. VS 2022 on windows-2022 works.
          - os: windows-2022
            args: --win
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unconfigured GitHub secrets resolve to empty strings, and an empty
      # CSC_LINK makes electron-builder try to load it as a certificate file
      # and fail. Decode CSC_LINK to a .p12 on disk and verify macOS can import
      # it before electron-builder runs (catches bad base64 and OpenSSL 3 p12).
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          append_env() {
            local name="$1"
            local value="$2"
            {
              echo "${name}<<EOF"
              echo "$value"
              echo "EOF"
            } >> "$GITHUB_ENV"
          }

          if [ -z "${CSC_LINK_B64}" ]; then
            echo "No signing certificate configured; disabling identity auto-discovery."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          else
            CERT_PATH="${RUNNER_TEMP}/signing-certificate.p12"
            echo "$CSC_LINK_B64" | tr -d '[:space:]' | openssl base64 -d -A -out "$CERT_PATH"

            if [ ! -s "$CERT_PATH" ]; then
              echo "::error::CSC_LINK decoded to an empty file. Re-encode with: base64 -w0 developer_id.p12"
              exit 1
            fi

            KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

            if ! security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
                 -T /usr/bin/codesign -T /usr/bin/productbuild 2>&1; then
              echo "::error::Could not import CSC_LINK as a PKCS#12 certificate (SecKeychainItemImport: Unknown format in import)."
              echo "::error::If you created the .p12 on Linux with OpenSSL 3, re-export with legacy encryption:"
              echo "::error::  openssl pkcs12 -export -legacy -inkey developer_id.key -in developer_id.pem -certfile DeveloperIDG2CA.pem -out developer_id.p12"
              echo "::error::Then update the CSC_LINK secret: base64 -w0 developer_id.p12"
              exit 1
            fi

            append_env CSC_LINK "$CERT_PATH"
            append_env CSC_KEY_PASSWORD "$CSC_KEY_PASSWORD"
          fi

      - name: Build and publish
        working-directory: apps/harborclient
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEBUG: electron-notarize*
        run: pnpm dist -- ${{ matrix.args }} --publish always

  build-rpm:
    needs: release
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9

    steps:
      - name: Install Rocky build dependencies
        # libxcrypt-compat: electron-builder's bundled fpm Ruby needs libcrypt.so.1 (removed from RHEL 9 base).
        run: dnf install -y git rpm-build gcc gcc-c++ make python3 libxcrypt-compat

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish RPM
        working-directory: apps/harborclient
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        run: pnpm dist -- --linux rpm --publish always
