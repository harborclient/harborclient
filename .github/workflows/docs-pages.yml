name: Docs pages

# Deploy redirect stubs for the former @harborclient/core, @harborclient/sdk, and
# @harborclient/http VitePress sites, plus the SDK Storybook bundle, to GitHub Pages.
#
# Canonical package documentation now lives on harborclient.com under /core/,
# /sdk/, and /http/. This Pages site keeps Storybook at
# /harborclient/sdk/storybook/ and redirects the old doc routes.
#
# Repository: https://github.com/harborclient/harborclient
#
# Automatically deploys when documentation sources change on main.
# Manual dispatch remains available so docs can be published from any branch/ref
# without merging to main first. Provide `source_ref` with the
# branch, tag, or SHA whose content should be deployed.
#
# Required repository setup:
#   1. Settings → Pages → Build and deployment → Source: GitHub Actions
#   2. Optional custom domain configured in Pages settings
#
# Run from the repo root once this workflow exists on a dispatchable ref:
#
#   gh workflow run docs-pages.yml --ref main \
#     -f source_ref=main
#
# Deployed site entry points:
#   https://harborclient.github.io/harborclient/          (links to harborclient.com)
#   https://harborclient.github.io/harborclient/core/     (redirect stub)
#   https://harborclient.github.io/harborclient/sdk/      (redirect stub)
#   https://harborclient.github.io/harborclient/http/     (redirect stub)
#   https://harborclient.github.io/harborclient/sdk/storybook/

on:
  push:
    branches:
      - main
    paths:
      - packages/core/README.md
      - packages/core/docs/**
      - packages/core/scripts/build-docs-nav.mjs
      - packages/core/scripts/docs-nav.config.mjs
      - packages/core/scripts/docs-slugger.mjs
      - packages/core/scripts/docs-link-rewriter.mjs
      - packages/core/scripts/docs-site.config.mjs
      - packages/core/scripts/assert-docs-slugs.mjs
      - packages/core/package.json
      - packages/sdk/README.md
      - packages/sdk/docs/**
      - packages/sdk/src/**
      - packages/sdk/.storybook/**
      - packages/sdk/scripts/build-docs-nav.mjs
      - packages/sdk/scripts/docs-nav.config.mjs
      - packages/sdk/scripts/docs-slugger.mjs
      - packages/sdk/scripts/docs-link-rewriter.mjs
      - packages/sdk/scripts/docs-site.config.mjs
      - packages/sdk/scripts/assert-docs-slugs.mjs
      - packages/sdk/package.json
      - packages/http/README.md
      - packages/http/docs/**
      - packages/http/scripts/build-docs-nav.mjs
      - packages/http/scripts/docs-nav.config.mjs
      - packages/http/scripts/docs-slugger.mjs
      - packages/http/scripts/docs-link-rewriter.mjs
      - packages/http/scripts/docs-site.config.mjs
      - packages/http/scripts/assert-docs-slugs.mjs
      - packages/http/package.json
      - scripts/build-docs-site.mjs
      - pnpm-lock.yaml
      - .github/workflows/docs-pages.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag, or SHA to build docs from'
        required: true
        default: main
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build combined docs site
        run: pnpm docs:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
