name: Notify site docs update

# Triggers a harborclient-site deploy when package documentation changes on main
# so harborclient.com/{core,sdk,http,team-hub,team-hub-api}/ stays in sync with the monorepo.

on:
  push:
    branches:
      - main
    paths:
      - packages/core/docs/**
      - packages/sdk/docs/**
      - packages/http/docs/**
      - packages/team-hub/docs/**
      - packages/team-hub-api/docs/**

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger harborclient-site deploy
        env:
          SITE_DEPLOY_PAT: ${{ secrets.SITE_DEPLOY_PAT }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${SITE_DEPLOY_PAT}" \
            https://api.github.com/repos/harborclient/site/dispatches \
            -d '{"event_type":"catalog-updated","client_payload":{"sha":"'"${{ github.sha }}"'","ref":"'"${{ github.ref }}"'","reason":"package-docs"}}'
