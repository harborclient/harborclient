name: Notify team-hub docs index update

# Triggers the monorepo Team Hub deploy when the in-app docs search index
# changes so the Team Hub Docker image can refresh its Orama docs payload.

on:
  push:
    branches:
      - main
    paths:
      - resources/docsSearchIndex.json

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Team Hub deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run team-hub-deploy.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main
