name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: harborclient
          MYSQL_DATABASE: harborclient_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pharborclient"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: harborclient
          POSTGRES_DB: harborclient_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up JDK 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm build:sdk

      - name: Build shortcut-runner
        run: pnpm build:shortcut-runner

      - name: Build http
        run: pnpm build:http

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

      - name: Check published SDK types (ATTW)
        working-directory: packages/sdk
        run: |
          TARBALL=$(pnpm pack --pack-destination /tmp | tail -1)
          npx --yes @arethetypeswrong/cli@0.18.4 "$TARBALL" --profile esm-only --no-summary

      - name: Check published http types (ATTW)
        working-directory: packages/http
        run: |
          TARBALL=$(pnpm pack --pack-destination /tmp | tail -1)
          npx --yes @arethetypeswrong/cli@0.18.4 "$TARBALL" --profile esm-only --no-summary

      - name: Test SDK
        run: pnpm --filter @harborclient/sdk test

      - name: Test http
        run: pnpm --filter @harborclient/http test

      - name: Test team-hub-api
        run: pnpm --filter @harborclient/team-hub-api test

      - name: Test team-hub
        run: pnpm --filter @harborclient/team-hub test

      - name: Test
        env:
          HARBOR_TEST_MYSQL_HOST: 127.0.0.1
          HARBOR_TEST_MYSQL_PORT: 3306
          HARBOR_TEST_MYSQL_USER: root
          HARBOR_TEST_MYSQL_PASSWORD: harborclient
          HARBOR_TEST_MYSQL_DATABASE: harborclient_test
          HARBOR_TEST_POSTGRES_HOST: 127.0.0.1
          HARBOR_TEST_POSTGRES_PORT: 5432
          HARBOR_TEST_POSTGRES_USER: postgres
          HARBOR_TEST_POSTGRES_PASSWORD: harborclient
          HARBOR_TEST_POSTGRES_DATABASE: harborclient_test
        working-directory: apps/gui
        run: >-
          pnpm exec firebase emulators:exec
          --only auth,firestore
          --project demo-harborclient-test
          "node ../../scripts/test-with-native.mjs"
