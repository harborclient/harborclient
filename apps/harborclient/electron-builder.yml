appId: com.harborclient
productName: HarborClient
protocols:
  - name: HarborClient
    schemes:
      - harborclient
extraMetadata:
  name: harborclient
  productName: HarborClient
artifactName: harborclient-${version}.${ext}
executableName: harborclient
# Resource paths below are relative to the electron-builder project directory
# (apps/gui via --project). Exception: mac.entitlements* are forwarded to
# codesign as-is and must resolve from the dist.mjs cwd (apps/harborclient),
# so dist.mjs also passes absolute -c.mac.entitlements* overrides.
icon: build/icons/512x512.png
extraResources:
  - from: build/icons/512x512.png
    to: icon.png
  - from: plugins/catalog.json
    to: plugins/catalog.json
  - from: resources/docsSearchIndex.json
    to: docsSearchIndex.json
  - from: resources/builtin_themes
    to: builtin_themes
  - from: resources/builtin_collections
    to: builtin_collections
  - from: ../cli/dist/index.js
    to: cli/index.js
  - from: ../cli/dist/node_modules
    to: cli/node_modules
    # Defense in depth: never ship node-gyp intermediates into Resources.
    # macOS codesign fails on `.o` files under obj.target with entitlements.
    filter:
      - '**/*'
      - '!**/obj.target/**'
      - '!**/build/Release/obj/**'
      - '!**/build/Release/.deps/**'
      - '!**/*.o'
      - '!**/*.a'
      - '!**/*.lib'
directories:
  buildResources: build
  output: ../harborclient/release
files:
  - out/**/*
  - package.json
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*
  - '!**/node_modules/**/*.tgz'
  - '!**/node_modules/**/prebuilds/**'
  - '!**/node_modules/**/obj.target/**'
  - '!**/node_modules/**/build/Release/obj/**'
  - '!**/node_modules/**/build/Release/.deps/**'
  - '!**/node_modules/**/*.o'
  - '!**/node_modules/**/*.a'
  - '!**/node_modules/**/*.lib'
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*
  - node_modules/esbuild/**/*
  - node_modules/@esbuild/**/*
  - node_modules/react/**/*
  - node_modules/react-dom/**/*
  - node_modules/scheduler/**/*
  - node_modules/@harborclient/sdk/**/*
linux:
  icon: build/icons
  syncDesktopName: true
  target:
    - AppImage
    - deb
    - rpm
  category: Development
  maintainer: HarborClient <contact@harborclient.com>
  vendor: HarborClient
rpm:
  packageCategory: Applications/Development
mac:
  artifactName: harborclient-${version}-${arch}.${ext}
  target:
    target: default
    arch:
      - arm64
      - x64
  type: distribution
  hardenedRuntime: true
  gatekeeperAssess: false
  # Relative to the electron-builder process cwd (apps/harborclient via dist.mjs),
  # not projectDir. codesign receives this path as-is; a bare `build/...` path
  # resolves under harborclient and fails with "cannot read entitlement data".
  entitlements: ../gui/build/entitlements.mac.plist
  entitlementsInherit: ../gui/build/entitlements.mac.plist
  notarize: true
win:
  signAndEditExecutable: false
  target:
    - nsis
publish:
  provider: github
  owner: harborclient
  repo: harborclient
  releaseType: release
