# App-only Team Hub against external Postgres + Redis.
# Bundled Postgres/Redis stay disabled even if .env accidentally re-enables them.
#
# Prerequisites: reachable Postgres and Redis (managed or local). Copy .env.example
# to .env and set TEAM_HUB_DB_* / TEAM_HUB_REDIS_* hosts.
#
# Usage:
#   docker compose -f compose.external.yaml up -d
#
# For a local end-to-end stack (Postgres + Redis + app), use
# compose.external.reference.yaml instead.

services:
  team-hub:
    image: ghcr.io/harborclient/team-hub:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TEAM_HUB_START_POSTGRES: 'false'
      TEAM_HUB_START_REDIS: 'false'
    ports:
      - '${HOST_PORT:-8080}:8080'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      # Prefer /readyz (DB+Redis); fall back to /health for older images.
      # Uses Node fetch — runtime image has no curl (matches Dockerfile HEALTHCHECK).
      test:
        [
          'CMD',
          'node',
          '-e',
          "const p=process.env.PORT||8080; const tryUrl=async(u)=>{const r=await fetch(u);if(!r.ok)throw new Error('bad');}; tryUrl('http://127.0.0.1:'+p+'/readyz').catch(()=>tryUrl('http://127.0.0.1:'+p+'/health')).then(()=>process.exit(0)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s
