# Local reference stack: separate Postgres + Redis containers + app-only Team Hub.
# Team Hub still disables bundled services (TEAM_HUB_START_POSTGRES/REDIS=false).
#
# Usage:
#   cp .env.example .env
#   docker compose -f compose.external.reference.yaml up -d
#   curl -s http://127.0.0.1:8080/healthz
#   curl -s http://127.0.0.1:8080/readyz
#
# For production against managed Postgres/Redis, use compose.external.yaml.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEAM_HUB_DB_USER:-harbor}
      POSTGRES_PASSWORD: ${TEAM_HUB_DB_PASSWORD:-change-me}
      POSTGRES_DB: ${TEAM_HUB_DB_DATABASE:-harbor}
    volumes:
      - team-hub-external-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  team-hub:
    image: ghcr.io/harborclient/team-hub:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TEAM_HUB_START_POSTGRES: 'false'
      TEAM_HUB_START_REDIS: 'false'
      TEAM_HUB_DB_HOST: postgres
      TEAM_HUB_DB_PORT: '5432'
      TEAM_HUB_REDIS_HOST: redis
      TEAM_HUB_REDIS_PORT: '6379'
    ports:
      - '${HOST_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Prefer /readyz (DB+Redis); fall back to /health for older images.
      # Uses Node fetch — runtime image has no curl (matches Dockerfile HEALTHCHECK).
      test:
        [
          'CMD',
          'node',
          '-e',
          "const p=process.env.PORT||8080; const tryUrl=async(u)=>{const r=await fetch(u);if(!r.ok)throw new Error('bad');}; tryUrl('http://127.0.0.1:'+p+'/readyz').catch(()=>tryUrl('http://127.0.0.1:'+p+'/health')).then(()=>process.exit(0)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s

volumes:
  team-hub-external-pgdata:
