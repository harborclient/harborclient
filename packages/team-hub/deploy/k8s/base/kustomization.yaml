apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: team-hub

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - hpa.yaml
  - service.yaml
  - ingress.yaml
  - ingress-notices.yaml
  - migrate-job.yaml

# secret.example.yaml is intentionally omitted — create the Secret manually
# (see deploy/k8s/README.md and docs/deploy/k8s.md).

labels:
  - pairs:
      app.kubernetes.io/name: team-hub
      app.kubernetes.io/part-of: harborclient
    includeSelectors: false

images:
  - name: ghcr.io/harborclient/team-hub
    newTag: latest
