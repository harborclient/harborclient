# CPU/memory HPA for Deployment team-hub. Requires metrics-server (or equivalent).
# Tune maxReplicas from DB pool math: maxReplicas × TEAM_HUB_DB_MAX ≤ max_connections × 0.75
# See packages/team-hub/docs/deploy/k8s.md (Autoscaling).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: team-hub
  namespace: team-hub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: team-hub
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
