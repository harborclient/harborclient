apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-hub
  namespace: team-hub
  labels:
    app: team-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: team-hub
  template:
    metadata:
      labels:
        app: team-hub
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '8080'
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: team-hub
          image: ghcr.io/harborclient/team-hub:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: team-hub
            - secretRef:
                name: team-hub
          resources:
            requests:
              cpu: '1'
              memory: 1Gi
            limits:
              cpu: '2'
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
