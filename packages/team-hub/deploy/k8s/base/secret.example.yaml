# EXAMPLE ONLY — do not commit real credentials.
# Prefer creating the Secret from literals (not applied by kustomization.yaml):
#
#   kubectl -n team-hub create secret generic team-hub \
#     --from-literal=TEAM_HUB_DB_PASSWORD='your-strong-password'
#
# Then delete this example file from any apply path, or leave it out of kustomize.
apiVersion: v1
kind: Secret
metadata:
  name: team-hub
  namespace: team-hub
type: Opaque
stringData:
  TEAM_HUB_DB_PASSWORD: change-me
