[package]
name = "team-hub-mls-prototype"
version = "0.0.0"
edition = "2021"
publish = false
description = "OpenMLS proof-of-concept for Team Hub encrypted discussion bodies (Task 4.1)"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
openmls = { version = "0.8.1", features = ["test-utils"] }
openmls_rust_crypto = "0.5"
openmls_basic_credential = "0.5"
openmls_memory_storage = "0.5"
openmls_traits = "0.5"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
openmls_traits = "0.5"
